trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.0.x'

steps:
- task: UseDotNet@2
  displayName: 'Instalar SDK de .NET 10'
  inputs:
    packageType: 'sdk'
    version: '$(dotnetSdkVersion)'

- task: DotNetCoreCLI@2
  displayName: 'Restaurar paquetes NuGet'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Compilar proyecto'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publicar aplicación web'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Guardar artefacto compilado'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: AzureWebApp@1
  displayName: 'Desplegar en Azure Web App'
  inputs:
    azureSubscription: 'Azure for Students(364d5879-31ac-4cda-9324-764c8b01dc57)'
    appType: 'webApp'
    appName: 'RG-VeterinariaWeb'
    deployToSlotOrASE: false
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Azure for Students(1)(364d5879-31ac-4cda-9324-764c8b01dc57)'
    appType: 'webApp'
    appName: 'RG-VeterinariaWeb'
    deployToSlotOrASE: true
    resourceGroupName: 'RG-VeterinariaWeb_group'
    slotName: 'production'
    package: '$(System.DefaultWorkingDirectory)/**/*.zip'
    deploymentMethod: 'auto'